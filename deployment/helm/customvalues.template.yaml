# extraImagePullSecrets:                    # The images are hosted in a private registry, i.e. you need to provide a pull secret, e.g. created with:
#   - name: starwit-internal-registry       # kubectl create secret docker-registry starwit-internal-registry --docker-server=docker.internal.starwit-infra.de --docker-username=<user> --docker-password=<password>

image:
  repository: docker.internal.starwit-infra.de/sae-anomaly-detection
  # tag: ""                                 # Defaults to the chart's appVersion

useGpu: false                               # If true, runtimeClassName is set to "nvidia" and one nvidia.com/gpu is requested (speeds up training considerably)

persistence:                                # Volume mounted at /code/model, holds collected training data and the trained model (all model paths below must point there)
  enabled: true                             # If false, an emptyDir is used, i.e. the trained model is lost on pod restart
  existingClaim: ""                         # Use an existing PVC instead of creating one
  storageClass: ""                          # Empty means cluster default storage class
  accessModes:
    - ReadWriteOnce
  size: 10Gi                                # Every training run stores its dataset next to the model, i.e. leave some headroom
  annotations: {}                           # The chart-managed PVC is annotated with helm.sh/resource-policy=keep, i.e. it survives helm uninstall

settingsYaml:                               # Everything below this is passed as content of the settings.yaml (notice snake_case vs camelCase)
  log_level: INFO                           # Options: ERROR, WARNING, INFO, DEBUG
  redisIn:
    host: sae-valkey                        # Valkey service of the SAE chart (<sae-release-name>-valkey)
    port: 6379
    stream_id: stream1
    stream_prefix: objecttracker            # Read tracked objects from '{stream_prefix}:{stream_id}' (e.g. geomapper if positions should be included)
  redisOut:
    host: sae-valkey
    port: 6379
    stream_id: stream1
    stream_prefix: anomalydetection         # Anomaly messages are written to '{stream_prefix}:{stream_id}'
  filtering: true
  model:
    start_training: false                   # If true and there is no model yet, data is collected for time_interval_train_data hours, then a model is trained and stored in the volume.
                                            # No detection happens during collection. If a model already exists, training is skipped (delete parameters.json and model_weights.pth to retrain).
    time_interval_train_data: 24            # In hours, how much data should be collected for training
    path_train_data: model/dataset          # Prefix of the directory where collected training data is stored (a timestamp is appended)
    parameters_path: model/parameters.json
    weights_path: model/model_weights.pth
    #anomaly_threshold_override: 0.5        # Only for testing
  prometheus_port: 8000

resources: {}                               # Standard k8s container resources (nvidia.com/gpu limit is added automatically if useGpu is true)
