{{- $imageRepo := required "image repository for sae-anomaly-detection is required" .Values.image.repository }}
{{- $imageTag := required "image tag for sae-anomaly-detection is required" (.Values.image.tag | default .Chart.AppVersion) }}
{{- $redisIn := required "settingsYaml.redisIn is required" .Values.settingsYaml.redisIn }}
{{- $resources := deepCopy (.Values.resources | default dict) }}
{{- if .Values.useGpu }}
{{- $_ := set $resources "limits" (merge (dict "nvidia.com/gpu" 1) ($resources.limits | default dict)) }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sae-anomaly-detection.fullname" . }}
  labels:
    {{- include "sae-anomaly-detection.labels" . | nindent 4 }}
    app.kubernetes.io/component: anomaly-detection
spec:
  selector:
    matchLabels:
      {{- include "sae-anomaly-detection.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: anomaly-detection
  template:
    metadata:
      annotations:
        sae.starwit.de/stage: anomaly-detection
        sae.starwit.de/config-checksum: {{ include (print .Template.BasePath "/anomaly-detection.configmap.yaml") . | sha256sum }}
      labels:
        {{- include "sae-anomaly-detection.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: anomaly-detection
    spec:
      serviceAccountName: {{ include "sae-anomaly-detection.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.useGpu }}
      runtimeClassName: nvidia
      {{- end }}
      initContainers:
        - name: wait-for-valkey
          image: valkey/valkey:7.2.6-alpine
          command: ["sh", "-c", "while ! redis-cli -h {{ $redisIn.host | default "localhost" }} -p {{ $redisIn.port | default 6379 }} ping ; do echo \"$(date -Iseconds) - still waiting for valkey\"; sleep 1; done"]
      containers:
        - name: anomaly-detection
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ $imageRepo }}:{{ $imageTag }}"
          imagePullPolicy: IfNotPresent
          resources:
            {{- toYaml $resources | nindent 12 }}
          ports:
            - name: prometheus
              containerPort: {{ .Values.settingsYaml.prometheus_port | default 8000 }}
          volumeMounts:
            - name: config
              mountPath: /code/settings.yaml
              subPath: settings.yaml
            - name: model
              mountPath: /code/model
      volumes:
        - name: config
          configMap:
            name: {{ include "sae-anomaly-detection.fullname" . }}-config
        - name: model
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sae-anomaly-detection.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
