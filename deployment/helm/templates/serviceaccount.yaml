apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "serviceAccountName" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
imagePullSecrets:
{{- if .Values.existingPullSecret }}
  - name: {{ .Values.existingPullSecret }}
{{- else }}
  - name: sae-anomaly-detection-pull-secret
{{- end }}
