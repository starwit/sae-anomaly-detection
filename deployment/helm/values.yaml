nameOverride: ""
fullnameOverride: ""

# extraImagePullSecrets:
#   - name: extra-pull-secret

image:
  repository: docker.internal.starwit-infra.de/sae-anomaly-detection
  # tag: ""                                 # defaults to the chart's appVersion

# When set to true the runtimeClassName is set to "nvidia" and a GPU resource is requested
useGpu: false

# Volume mounted at /code/model; holds collected training data and the trained model
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

# Everything below this is passed as content of the settings.yaml (see settings.template.yaml for options)
settingsYaml:
  log_level: INFO
  redisIn:
    host: sae-valkey
    port: 6379
    stream_id: stream1
    stream_prefix: objecttracker
  redisOut:
    host: sae-valkey
    port: 6379
    stream_id: stream1
    stream_prefix: anomalydetection
  filtering: true
  model:
    start_training: false
    time_interval_train_data: 24
    path_train_data: model/dataset
    parameters_path: model/parameters.json
    weights_path: model/model_weights.pth
  prometheus_port: 8000

resources: {}

podSecurityContext:
  fsGroup: 1000

securityContext: {}

nodeSelector: {}

affinity: {}

tolerations: []
