name: Build and publish latest image

on:
  workflow_dispatch:

permissions: read-all

env:
  IMAGE_NAME: sae-anomaly-detection
  DOCKER_USERNAME: ${{ secrets.DOCKER_INTERNAL_USERNAME }}
  DOCKER_ORG: docker.internal.starwit-infra.de
  DOCKER_PWD: ${{ secrets.DOCKER_INTERNAL_PASSWORD }}

jobs:
  build:
    name: "Build and run docker image"
    runs-on: [self-hosted, linux, X64]

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login internal docker registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_ORG }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PWD }}

    - name: Get Docker version
      run: |
        APP_VERSION=$(cat pyproject.toml | grep "version" | cut -d'=' -f2 | xargs echo -n) 
        echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
        
    - name: Build and push
      uses: docker/build-push-action@v5
      env:
        GIT_CREDENTIALS: https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/starwit/
      with:
        context: .
        file: ./Dockerfile
        sbom: true
        provenance: mode=max
        push: true
        secrets: GIT_CREDENTIALS=${{ env.GIT_CREDENTIALS }}
        tags: ${{ env.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}




